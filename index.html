<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Achadinhos Fashion Store Campinas</title>
<meta name="description" content="Achadinhos selecionados pela Fashion Store Campinas: moda fitness, acessórios e mais.">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{--rosa:#F574AC;--rosa-claro:#FED6E1;--fundo:#1b1416;--texto:#fff;--sub:#e9d6dc}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fundo);color:var(--texto);font-family:Poppins,sans-serif;padding:0 16px 40px}
header{text-align:center;padding:28px 0 18px}
header img{width:110px;height:110px}
h1{font-size:26px;font-weight:800;margin-top:10px}
h1 em{font-family:'Playfair Display',serif;color:var(--rosa)}
header p{color:var(--sub);font-size:14px;margin-top:6px}
.wa{display:inline-block;margin-top:14px;background:var(--rosa-claro);color:var(--fundo);font-weight:600;font-size:14px;padding:10px 20px;border-radius:30px;text-decoration:none}
.grid{max-width:560px;margin:0 auto;display:grid;gap:16px}
.card{background:#261c1f;border-radius:18px;overflow:hidden;display:flex;gap:14px;align-items:center;padding:12px}
.card img{width:110px;height:110px;object-fit:cover;border-radius:12px;background:#fff;flex-shrink:0}
.card h2{font-size:16px;font-weight:600;line-height:1.25}
.card .preco{color:var(--rosa);font-weight:800;font-size:20px;margin:4px 0 8px}
.card a{display:inline-block;background:var(--rosa);color:#fff;font-weight:600;font-size:14px;padding:8px 16px;border-radius:24px;text-decoration:none}
footer{text-align:center;color:#b99aa4;font-size:12px;margin-top:26px;line-height:1.6}
</style></head><body>
<header><img src="logo.png" alt="Fashion Store Campinas">
<h1>Achadinhos da <em>Fashion</em></h1>
<p>Seleção da semana · toque em "Comprar" para abrir na Shopee</p>
<a class="wa" href="https://wa.me/5519971298930">Atendimento no WhatsApp</a></header>
<main class="grid" id="lista"></main>
<footer>Links de afiliado Shopee: você paga o mesmo preço e ajuda a loja.<br>Preços sujeitos a alteração na Shopee.<br>Fashion Store Campinas</footer>
<script>
const itens=[
["Tampa-bumbum para legging","R$ 29,90","tampa.webp","https://s.shopee.com.br/5q9mLxG6Wg"],
["Top fitness alta sustentação","R$ 35,94","top.webp","https://s.shopee.com.br/6Amckand4k"],
["Legging fitness com bolso lateral","R$ 38,94","legging.webp","https://s.shopee.com.br/2LZuBanT2x"],
["Regata plus size dry, proteção UV","R$ 34,32","regata.webp","https://s.shopee.com.br/4fxoxsACPV"],
["Óculos de sol grande polarizado","R$ 30,65","oculos.webp","https://s.shopee.com.br/9fMUv256R7"],
["Kit 5 faixas para treino e skincare","R$ 15,12","faixa.webp","https://s.shopee.com.br/2BGTzIEyux"]];
document.getElementById('lista').innerHTML=itens.map(([n,p,i,l])=>`<div class="card"><img src="${i}" alt="${n}" loading="lazy"><div><h2>${n}</h2><div class="preco">${p}</div><a href="${l}" target="_blank" rel="noopener">Comprar na Shopee</a></div></div>`).join('');
</script></body></html>
